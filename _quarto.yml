project:
  type: website
  output-dir: "docs/"
  render:
  - "*.qmd"
  - "schedule.qmd"
  - "!resources/"
  - "!common/"
  - "!slides/"
  - "!assignments/"
  - "!private/"
  - "!data/"
  pre-render:
    - "touch schedule.qmd"
    - build_pdf_slides.R
    - build_posts.R
  post-render:
    - "cp -rf resources/ docs/resources/"
    - "cp -rf assignments/ docs/assignments/"
    - "cp -rf slides/ docs/slides/"

